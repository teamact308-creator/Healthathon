name: CARE prototype checks
on:
  push:
    paths: ['integrations/care/**', '.github/workflows/care-prototype.yml']
  pull_request:
    paths: ['integrations/care/**', '.github/workflows/care-prototype.yml']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/care
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/care/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
