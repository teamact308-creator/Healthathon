services:
  backend:
    build:
      args:
        ADDITIONAL_PLUGS: ""
    environment: &wholecare_env
      ADDITIONAL_PLUGS: '[{"name":"care_wholecare","package_name":"/plugins/care_wholecare","version":"","configs":{}}]'
      DJANGO_SETTINGS_MODULE: care_wholecare.dev_settings
      DJANGO_ALLOWED_HOSTS: '["localhost","127.0.0.1","backend"]'
      WHOLECARE_BROWSER_ORIGINS: '["http://localhost:47417", "http://localhost:47418"]'
      WHOLECARE_LINKS_FILE: /run/wholecare/links.json
      WHOLECARE_SESSION_DIR: /run/wholecare/sessions
      WHOLECARE_SESSION_KEY_FILE: /run/wholecare/session.key
    volumes:
      - &plugin_mount
        type: bind
        source: ${PLUGIN_BE:?Set PLUGIN_BE}
        target: /plugins/care_wholecare
        bind:
          create_host_path: false
      - &links_mount
        type: bind
        source: ${WHOLECARE_LINKS_HOST_FILE:?Set WHOLECARE_LINKS_HOST_FILE}
        target: /run/wholecare/links.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WHOLECARE_SESSIONS_HOST_DIR:?Set WHOLECARE_SESSIONS_HOST_DIR}
        target: /run/wholecare/sessions
        bind:
          create_host_path: false
      - type: bind
        source: ${WHOLECARE_SESSION_KEY_HOST_FILE:?Set WHOLECARE_SESSION_KEY_HOST_FILE}
        target: /run/wholecare/session.key
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["bash", "-c", "python -m pip install -e /plugins/care_wholecare && exec bash scripts/start-dev.sh"]
  celery:
    environment: *wholecare_env
    volumes:
      - *plugin_mount
      - *links_mount
    entrypoint: ["bash", "-c", "python -m pip install -e /plugins/care_wholecare && exec bash scripts/celery-dev.sh"]
